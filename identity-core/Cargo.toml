# SPDX-License-Identifier: Apache-2.0
[package]
name = "munarium-warden-identity"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Warden's existing decision principal verifier without grant storage or credential brokering."
publish = false

[lib]
path = "lib.rs"

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
