# SPDX-License-Identifier: Apache-2.0
[package]
name = "munarium-warden"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Verified principal chains, claim-bound grants, isolated credential brokering, and bounded revocation."
repository = "https://github.com/iokaio/munarium-warden"
readme = "README.md"
publish = false

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
getrandom = "=0.3.4"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
jsonschema = { version = "=0.26.2", default-features = false }
zeroize = "=1.8.2"
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "=2.2.0"

[dev-dependencies]
tempfile = "=3.27.0"
